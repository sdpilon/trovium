[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trovium"
version = "0.1.2"
description = "Unix-philosophy replacements for the *arr media-automation stack; each pipeline step is an independent tool."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "sdpilon" }]
keywords = ["media", "automation", "ingest", "qbittorrent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
trovium-ingest = "trovium.cli:main"
trovium-rename = "trovium.rename:main"
trovium-run = "trovium.run:main"
trovium-deploy = "trovium.deploy.cli:main"

[project.urls]
Homepage = "https://github.com/sdpilon/trovium"
Repository = "https://github.com/sdpilon/trovium"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.4",
  "pytest-xdist>=3.8.0",
  "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trovium"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "-n", "auto", "--durations=15"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
# Vendored spec-kit / extension runtimes are projected, not authored here;
# exclude them the same way the gates policy excludes .specify/** from the
# markdown and shell linters. Editing them would break projection parity.
extend-exclude = [".specify", ".opencode", ".claude"]

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "E",   # pycodestyle errors
  "F",   # Pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "PT",  # flake8-pytest-style
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201"]

[tool.ruff.lint.isort]
known-first-party = ["trovium"]
