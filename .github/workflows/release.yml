name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Install gate tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
          # Keep this boundary on the same pinned versions as local runs and
          # gates.yml: shellcheck comes from the checksum-verified release
          # when .tool-versions pins it, and the Node linters come from the
          # lockfile when one is present.
          if grep -qs '^shellcheck[[:space:]]' .tool-versions; then
            bash .specify/gates/install-shellcheck.sh
          else
            sudo apt-get install -y -q shellcheck
          fi
          if [ ! -f package-lock.json ]; then
            echo "package-lock.json is required for pinned linters" >&2
            exit 1
          fi
          npm ci
      - name: Sync the Python environment
        run: uv sync --frozen
      - name: Run canonical quality gates
        env:
          UV_FROZEN: "1"
        run: bash scripts/check.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install bundle tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
      - name: Build release bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run python tools/release/build_bundle.py \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --locked \
            --out dist
      - name: Add bootstrap asset
        run: |
          cp install.sh dist/install.sh
          sha256sum dist/install.sh > dist/install.sh.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trovium-${{ matrix.platform }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `gh` resolves the repository from a git remote or GH_REPO; this job
          # has no checkout, and GITHUB_REPOSITORY alone is not enough.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "trovium $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            --verify-tag
