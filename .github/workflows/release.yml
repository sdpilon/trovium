name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Install gate tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq shellcheck
          npm install -g prettier markdownlint-cli2
      - name: Sync the Python environment
        run: uv sync --frozen
      - name: Run canonical quality gates
        env:
          UV_FROZEN: "1"
        run: bash scripts/check.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install bundle tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q jq
      - name: Build release bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run python tools/release/build_bundle.py \
            --version "$version" \
            --platform "${{ matrix.platform }}" \
            --locked \
            --out dist
      - name: Add bootstrap asset
        run: |
          cp install.sh dist/install.sh
          sha256sum dist/install.sh > dist/install.sh.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: trovium-${{ matrix.platform }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "trovium $GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME" \
            --verify-tag
